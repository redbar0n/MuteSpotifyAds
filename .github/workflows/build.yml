name: CI Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build App
        run: ./scripts/package_release.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Mutefy-Build
          path: dist/
